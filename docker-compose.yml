services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: retail_ops
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: retail
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - retail_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail -d retail_ops"]
      interval: 5s
      timeout: 5s
      retries: 10

  database-setup:
    build:
      context: .
      target: api-development
    command: ["node", "dist/database-cli.js", "prepare-local"]
    environment:
      MIGRATION_DATABASE_URL: postgresql://retail:retail@database:5432/retail_ops
      DATABASE_RUNTIME_ROLE: retail_app
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: api-development
    environment:
      DATABASE_URL: postgresql://retail_app:retail_app@database:5432/retail_ops
      PORT: 4000
      WEB_ORIGIN: http://localhost:8080
      COOKIE_SECURE: "false"
      OPERATOR_LOGIN_ENABLED: "true"
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      database-setup:
        condition: service_completed_successfully

  web:
    build:
      context: .
      target: web-runtime
      args:
        VITE_API_URL: http://localhost:4000/api
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api

volumes:
  retail_data:
