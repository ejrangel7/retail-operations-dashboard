services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: retail_ops
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: retail
    ports:
      - "5432:5432"
    volumes:
      - retail_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail -d retail_ops"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql://retail:retail@database:5432/retail_ops
      PORT: 4000
      WEB_ORIGIN: http://localhost:8080
      COOKIE_SECURE: "false"
    ports:
      - "4000:4000"
    depends_on:
      database:
        condition: service_healthy

  web:
    build: ./apps/web
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  retail_data:

