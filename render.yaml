services:
  - type: web
    name: retail-operations-dashboard
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: OPERATOR_LOGIN_ENABLED
        value: "false"
      - key: TRUST_PROXY_HOPS
        value: "1"
